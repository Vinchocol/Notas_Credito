<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#9a7414">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--ac:#9a7414;--acx:#fff;--bd:#dfe3e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161a;--card:#1d2026;--tx:#eceff3;--mu:#98a2b3;--ac:#d9a92b;--acx:#14161a;--bd:#323741}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1d2026;--tx:#eceff3;--mu:#98a2b3;--ac:#d9a92b;--acx:#14161a;--bd:#323741}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top img{width:52px;height:auto;border-radius:6px;background:#fff}
.top b{font-size:14px;line-height:1.2}.top span{display:block;color:var(--mu);font-size:12px;font-weight:400}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.step{color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
h1{font-size:21px;margin:0 0 14px}
input[type=text],textarea{text-transform:uppercase}
input[type=text],input[type=date],textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button:disabled{opacity:.45;cursor:not-allowed}
.grow{flex:1}
.drop{display:flex;align-items:center;justify-content:center;min-height:200px;border:2px dashed var(--bd);border-radius:12px;cursor:pointer;color:var(--mu);text-align:center;overflow:hidden;background:var(--bg)}
.drop img{max-width:100%;max-height:340px;display:block}
.sum{border-bottom:1px solid var(--bd);padding:8px 0;font-size:15px}.sum b{display:block;color:var(--mu);font-size:12px;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:12px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.msg{margin-top:12px;color:var(--mu);font-size:14px}
.opt{color:var(--mu);font-size:13px;font-weight:400}
</style>
</head>

const EMPRESA = "GRUPO EMPRESARIAL GRAJALES S.A.";
const AUTORIZA = "Lider de Ventas - Sandra Moreno Hernandez"; // fijo
const CAMPOS = [
  {id:"factura", label:"FACTURA No.",        type:"num"},
  {id:"fecha",   label:"FECHA FACTURA",      type:"date"},
  {id:"cliente", label:"NOMBRE DEL CLIENTE", type:"text"},
  {id:"producto",label:"PRODUCTO",           type:"text"},
  {id:"kilos",   label:"KILOS",              type:"num",  opt:true},
  {id:"vrkilo",  label:"$$ VR. KILO",        type:"money",opt:true},
  {id:"total",   label:"TOTAL NOTA CREDITO", type:"money"},
  {id:"motivo",  label:"MOTIVO NOTA CREDITO",type:"area"}
];
const data = {}, evid = [];
let phase = "campos", ci = 0, ei = 0;
const card = document.getElementById("card"), pb = document.getElementById("pb"), st = document.getElementById("st");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const miles = s => { const d = String(s).replace(/\D/g,""); return d ? d.replace(/\B(?=(\d{3})+(?!\d))/g,".") : ""; };
const fechaFmt = v => v ? v.split("-").reverse().join("/") : "";
const shown = (c,v) => !v ? "" : c.type==="date" ? fechaFmt(v) : c.type==="money" ? "$ "+miles(v) : c.type==="area"||c.type==="text" ? v.toUpperCase() : v;
const progress = (t,p) => { st.textContent = t; pb.style.width = p + "%"; };
const N = CAMPOS.length, TOT = N + 2;

function render(){ phase==="campos" ? rCampo() : phase==="evid" ? rEvid() : rFinal(); }

function rCampo(){
  const c = CAMPOS[ci], v = data[c.id] || (c.type==="date" ? new Date().toISOString().slice(0,10) : "");
  progress(`Datos · ${ci+1} de ${N}`, ci/TOT*100);
  const inp = c.type==="area" ? `<textarea id="f" autocapitalize="characters">${esc(v)}</textarea>`
    : c.type==="date" ? `<input id="f" type="date" value="${esc(v)}">`
    : `<input id="f" type="text" autocapitalize="characters" autocomplete="off" ${c.type==="num"?'inputmode="decimal"':c.type==="money"?'inputmode="numeric" placeholder="$"':''} value="${esc(c.type==="money"?miles(v):v)}">`;
  card.innerHTML = `<h1>${esc(c.label)} ${c.opt?'<span class="opt">(opcional)</span>':''}</h1>${inp}
    <div class="row">${ci>0?'<button id="bk">Atrás</button>':''}<button class="p grow" id="nx">Siguiente</button></div>`;
  const f = document.getElementById("f"); if(c.type!=="date") f.focus();
  if(c.type==="money") f.oninput = () => { f.value = miles(f.value); };
  else if(c.type!=="date") f.addEventListener("input", () => { const p = f.selectionStart; f.value = f.value.toUpperCase(); try{ f.setSelectionRange(p,p); }catch(e){} });
  const val = () => c.type==="money" ? f.value.replace(/\D/g,"") : c.type==="date" ? f.value.trim() : f.value.trim().toUpperCase();
  const nx = document.getElementById("nx");
  const chk = () => { nx.disabled = !c.opt && !val(); }; f.addEventListener("input", chk); chk();
  const go = () => { if(nx.disabled) return; data[c.id] = val();
    if(ci < N-1) ci++; else { phase="evid"; ei=0; } render(); };
  nx.onclick = go;
  if(c.type!=="area") f.onkeydown = e => { if(e.key==="Enter") go(); };
  if(ci>0) document.getElementById("bk").onclick = () => { data[c.id]=val(); ci--; render(); };
}

function rEvid(){
  const cur = evid[ei];
  progress(`Evidencia ${ei+1}`, (N + Math.min(ei,1)*0.8)/TOT*100);
  card.innerHTML = `<h1>Evidencia ${ei+1}</h1>
    <label class="drop">${cur?`<img src="${cur.dataUrl}" alt="">`:"Toca para seleccionar o tomar la imagen"}
      <input id="fi" type="file" accept="image/*" hidden></label>
    <div class="row"><button id="bk">Atrás</button>
      <button id="mas" ${cur?"":"disabled"}>+ Otra evidencia</button>
      <button class="p grow" id="ct" ${cur?"":"disabled"}>Continuar</button></div>`;
  document.getElementById("fi").onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    try{ evid[ei] = await prep(file); rEvid(); } catch(err){ alert("No se pudo leer la imagen."); }
  };
  document.getElementById("bk").onclick = () => {
    if(!evid[ei]) evid.length = ei;
    if(ei===0){ phase="campos"; ci=N-1; } else ei--; render(); };
  document.getElementById("mas").onclick = () => { ei++; render(); };
  document.getElementById("ct").onclick = () => { evid.length = ei+1; phase="final"; render(); };
}

function prep(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const M = 1400, k = Math.min(1, M/Math.max(img.width, img.height));
      const w = Math.round(img.width*k), h = Math.round(img.height*k);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res({dataUrl: cv.toDataURL("image/jpeg", .85), w, h});
    };
    img.onerror = rej; img.src = url;
  });
}

function rFinal(){
  progress("Listo para exportar", 100);
  card.innerHTML = `<h1>Revisar y exportar</h1>
    ${CAMPOS.map(c=>`<div class="sum"><b>${esc(c.label)}</b>${esc(shown(c,data[c.id])||"—")}</div>`).join("")}
    <div class="sum"><b>AUTORIZA</b>${esc(AUTORIZA)}</div>
    <div class="thumbs">${evid.map(e=>`<img src="${e.dataUrl}" alt="">`).join("")}</div>
    <div class="row"><button id="bk">Atrás</button><button class="p grow" id="pdf">Exportar PDF</button></div>
    <div class="row" style="margin-top:8px"><button id="nw" class="grow">Nueva nota crédito</button></div>
    <div class="msg" id="ms"></div>`;
  document.getElementById("bk").onclick = () => { phase="evid"; ei=evid.length-1; render(); };
  document.getElementById("nw").onclick = () => { if(confirm("¿Borrar todo y empezar una nueva?")){ for(const k in data) delete data[k]; evid.length=0; phase="campos"; ci=0; render(); } };
  document.getElementById("pdf").onclick = exportar;
}

function descargar(blob, fname){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 15000);
}

async function exportar(){
  const ms = document.getElementById("ms"), btn = document.getElementById("pdf");
  btn.disabled = true; ms.textContent = "Generando PDF…";
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:"mm", format:"a4"});
    const H = 297, x0 = 18.3, xm = 101.4, x1 = 182.6, W = x1-x0, RH = 5.4, SLOT_H = 60;
    doc.setLineWidth(0.25); doc.setDrawColor(0);
    doc.addImage(LOGO, "JPEG", 23, 19, 27, 25.4);
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text(EMPRESA, 67.7, 40.5);
    let y = 47.6;
    const rect = (x,yy,w,h) => doc.rect(x,yy,w,h);
    // encabezado
    rect(x0,y,W,RH); doc.setFontSize(10.5); doc.text("REPORTE NOTAS CREDITO", (x0+x1)/2, y+RH/2+1.3, {align:"center"}); y += RH;
    CAMPOS.forEach(c => {
      const v = data[c.id] || "";
      if(c.type==="area"){
        doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
        const lines = doc.splitTextToSize(v.toUpperCase(), x1-xm-2);
        const h = Math.max(RH*3, lines.length*4.6+2);
        rect(x0,y,xm-x0,h); rect(xm,y,x1-xm,h);
        doc.setFont("helvetica","bold"); doc.text(c.label, (x0+xm)/2, y+h-1.6, {align:"center"});
        doc.setFont("helvetica","normal"); doc.text(lines, xm+1, y+4.2, {lineHeightFactor:1.2});
        y += h; return;
      }
      rect(x0,y,xm-x0,RH); rect(xm,y,x1-xm,RH);
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
      doc.text(c.label, (x0+xm)/2, y+RH/2+1.3, {align:"center"});
      doc.setFont("helvetica","normal");
      if(c.type==="money" && v){ doc.text("$", xm+1.5, y+RH/2+1.3); doc.text(miles(v), x1-1, y+RH/2+1.3, {align:"right"}); }
      else if(v){ doc.text(shown(c,v), x1-1, y+RH/2+1.3, {align:"right"}); }
      y += RH;
    });
    // evidencias (2 por fila, con salto de página si hacen falta)
    const slotW = (x1-xm-3)/2; let i = 0;
    while(i < evid.length){
      const avail = Math.floor((H-15-y-RH)/SLOT_H);
      if(avail < 1){ doc.addPage(); y = 15; continue; }
      const n = Math.min(avail, Math.ceil((evid.length-i)/2)), h = n*SLOT_H;
      rect(x0,y,xm-x0,h); rect(xm,y,x1-xm,h);
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
      doc.text("EVIDENCIA", (x0+xm)/2, y+h/2+1.3, {align:"center"});
      for(let r=0; r<n; r++) for(let c=0; c<2; c++){
        const e = evid[i++]; if(!e) break;
        const bw = slotW-1, bh = SLOT_H-2, k = Math.min(bw/e.w, bh/e.h), iw = e.w*k, ih = e.h*k;
        const sx = xm+1+c*(slotW+1), sy = y+r*SLOT_H;
        doc.addImage(e.dataUrl, "JPEG", sx+(slotW-iw)/2, sy+(SLOT_H-ih)/2, iw, ih);
      }
      y += h;
    }
    // autoriza
    rect(x0,y,xm-x0,RH); rect(xm,y,x1-xm,RH);
    doc.setFont("helvetica","bold"); doc.text("AUTORIZA", x0+1, y+RH/2+1.3);
    doc.text(AUTORIZA, (xm+x1)/2, y+RH/2+1.3, {align:"center"});
    const blob = doc.output("blob");
    const fname = `Nota_Credito_${(data.factura||"").replace(/[^\w\-]+/g,"_")}.pdf`;
    descargar(blob, fname);
    ms.textContent = "PDF guardado en tu dispositivo (carpeta Descargas) ✔";
    const file = new File([blob], fname, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      const sb = document.createElement("button"); sb.className = "p"; sb.style.marginTop = "10px"; sb.textContent = "Compartir PDF";
      sb.onclick = () => navigator.share({files:[file], title:fname}).catch(()=>{});
      ms.appendChild(document.createElement("br")); ms.appendChild(sb);
    }
  }catch(err){
    ms.textContent = "No se pudo exportar: " + (err.message||err);
  }
  btn.disabled = false;
}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
